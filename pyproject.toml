[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicaid-spending-analytics"
version = "1.0.0"
description = "Medicaid prescription spending analysis with Python and SQL"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3.1", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "lxml>=5,<7"]

[project.optional-dependencies]
reports = ["reportlab==4.4.9"]

[tool.setuptools.packages.find]
where = ["src"]
